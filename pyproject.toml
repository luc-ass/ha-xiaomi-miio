[project]
name = "ha-xiaomi-miio"
version = "0.1.0"
description = "Core xiaomi_miio integration with clean-by-area support for Roborock vacuums"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.375",
    "python-miio==0.5.12",
    "micloud==0.5",
    "construct==2.10.68",
    "ruff",
    "arrow",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"

[tool.uv]
package = false

[tool.ruff.lint]
# Nur Fehler und Importe: Die Core-Dateien sollen unverändert durchgehen
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# Wie im Home-Assistant-Core, damit Core-Dateien unverändert durchgehen
force-sort-within-sections = true
known-first-party = ["homeassistant", "tests"]
known-third-party = ["syrupy", "pytest", "probatio", "pylint"]
forced-separate = ["tests"]
combine-as-imports = true
split-on-trailing-comma = false
